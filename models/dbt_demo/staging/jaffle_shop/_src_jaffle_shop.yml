version: 2

sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    description: A clone of a Postgres application database.
    config:
      freshness:
        warn_after: 
          count: 1
          period: day
        error_after: 
          count: 7
          period: day
      loaded_at_field: _etl_loaded_at
    tables:
      - name: customers
        description: Raw customer data.
        columns:
          - name: id
            description: Primary key for customer data.
            data_tests:
              - unique
              - not_null
        config:
          freshness: null
      - name: orders
        description: Raw order data.
        columns:
          - name: id
            description: Primary key for order data.
            data_tests:
              - unique
              - not_null